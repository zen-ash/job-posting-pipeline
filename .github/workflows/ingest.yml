name: Daily job ingest

"on":
  schedule:
    # 11:23 UTC. Actions cron is always UTC and does not observe DST, so this
    # lands at 6:23 AM EST in winter and 7:23 AM EDT in summer (Atlanta) --
    # a one-hour drift twice a year. See README "Why GitHub Actions" for why
    # that's an accepted tradeoff rather than something this workflow corrects.
    #
    # The odd :23 is deliberate. Scheduled workflows on free runners are
    # queued, not guaranteed, and top-of-the-hour slots are the most
    # contended -- at "0 11 * * *" this run fired 20 minutes late one day and
    # was skipped entirely the next. An off-peak minute competes with far
    # fewer jobs. It reduces contention; it does not eliminate skips (see
    # README "Schedule reliability").
    - cron: "23 11 * * *"
  # Lets a run be triggered by hand from the Actions tab, instead of waiting
  # for the next scheduled run to test a change.
  workflow_dispatch: {}

# Scheduled and manually-triggered runs shouldn't race each other against the
# same Postgres database; queue rather than run concurrently.
concurrency:
  group: job-ingest
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-latest
    # 30, not 15. Adding Workday roughly tripled the work: 29 boards, ~11,700
    # postings, plus ~1,300 job-detail requests, measured at ~19m40s. The
    # detail phase deliberately keeps its 0.2s inter-request pause
    # (job_ingest/ats/workday.py:DETAIL_DELAY_SECONDS) rather than trimming it
    # to fit a smaller budget -- these are unauthenticated public endpoints and
    # nobody is waiting on this run, so being a polite caller is worth more
    # than the ~3 minutes it would save.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run ingestion pipeline
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          DIGEST_FROM_EMAIL: ${{ secrets.DIGEST_FROM_EMAIL }}
          DIGEST_TO_EMAIL: ${{ secrets.DIGEST_TO_EMAIL }}
        run: python -m job_ingest.main
