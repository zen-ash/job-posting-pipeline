# Digest filters — deterministic keyword rules applied to postings that are
# otherwise pending notification (notified_at IS NULL AND closed_at IS NULL),
# before the round-robin + 50-cap selection. This is intentionally dumb
# (whole-word/phrase matching, no ML) — LLM-based relevance scoring is a later,
# separate step (see README "what's next"), not this.
#
# A posting must satisfy ALL of:
#   1. title contains at least one of title_include_keywords
#   2. title contains NONE of title_exclude_keywords
#   3. location contains at least one of location_include_keywords
#
# All matching is case-insensitive, period-stripped, and whole-word/phrase, so
# "sql" won't match "MySQL", "us" won't match inside "Russia", and "U.S." /
# "Sr." match exactly like "US" / "Sr" without needing separate keyword
# entries for the punctuated form — see job_ingest/filters.py. (US state codes
# below are the one exception: matched case-SENSITIVE and only immediately
# after a comma — see location_include_state_codes.)

title_include_keywords:
  # generic — 'analyst' alone catches most target titles
  - analyst
  - analytics
  - data analyst
  - business intelligence
  - data engineer
  - data scientist
  - reporting
  - insights
  - sql

  # audit & controls
  - audit
  - internal controls
  - sox
  - risk advisory

  # compliance & financial crime
  - compliance
  - aml
  - anti-money laundering
  - financial crimes
  - kyc
  - due diligence
  - transaction monitoring
  - sanctions
  - ofac
  - bsa
  - regulatory reporting

  # risk
  - risk
  - operational risk
  - vendor risk
  - third-party risk
  - enterprise risk
  - model validation

  # governance & data
  - data governance
  - grc

  # healthcare
  - claims
  - risk adjustment
  - revenue cycle
  - healthcare data

  # early-career signals
  - intern
  - internship
  # co-op spellings. "Co-Op, Internal Audit" contains no "intern" and would
  # otherwise never match. Hyphen and space forms both needed: the matcher
  # normalises case and periods but not hyphens, and "coop" does NOT match
  # inside "cooperative" (the trailing lookahead rejects the "e"), so the
  # spelled-out form needs its own entry.
  - co-op
  - coop
  - cooperative education
  # "associate" (bare) removed -- it's a generic entry-level title suffix used
  # across every department (sales, BD, private equity, collections), not a
  # domain signal. Confirmed against real data: it accounted for 70/153
  # (46%) of all matches, nearly all false positives ("Business Development
  # Associate", "Fraud Operations Associate"). A genuinely relevant title
  # like "Risk Associate" or "Compliance Associate" already matches on the
  # domain word ("risk"/"compliance") without needing "associate" at all, so
  # dropping it costs nothing on recall.
  - entry level
  - new grad
  - university

title_exclude_keywords:
  - senior
  - sr
  # Bare "staff" is back. It was narrowed to "staff engineer"/"staff
  # software" on the theory that "Staff Analyst" is an entry-level title at
  # universities and government agencies -- true in general, but moot here:
  # there are currently zero universities or agencies in companies.yml. At
  # the actual companies on the list (tech-adjacent fintechs), Staff ranks
  # ABOVE Senior, and the narrowed version was costing 11/50 digest slots to
  # titles like "Staff Data Analyst" and "Staff Data Scientist". If a Workday
  # adapter gets built for a university/agency (e.g. Emory, GSU) later, this
  # should become source-gated (excluded for Greenhouse/Lever/Ashby, allowed
  # for Workday) rather than reverting globally.
  - staff
  - principal
  - lead
  - manager
  - director
  - vp
  - vice president
  - head of
  # "leader" is a separate word, not a plural of "lead" -- the matcher's
  # optional trailing "s" already covers Leads/Seniors, and it deliberately
  # does NOT do \w* suffix matching, which would wrongly swallow
  # "Leadership" and "Leading".
  - leader
  - sales associate
  - associate director
  - associate general counsel
  - associate professor

  # legal roles pulled in by the broad compliance/risk includes above
  - counsel
  - attorney
  - paralegal

  # department-name collisions: an engineer or designer who happens to sit on
  # a team literally called "Risk" (e.g. "Backend Engineer, Payments and
  # Risk") matches the "risk" include even though the role itself has nothing
  # to do with risk analysis. This generalizes better than narrowing "risk"
  # itself. Deliberately does NOT include bare "engineer" or "scientist" --
  # both collide with existing include phrases ("data engineer", "data
  # scientist") and, since the exclude check runs independently of which
  # include keyword actually fired, would silently kill those two core
  # target titles too. Verified explicitly: with bare "engineer"/"scientist"
  # in this list, both "Data Engineer" and "Data Scientist" test as excluded.
  - designer
  - developer

  # More department-name collisions, same shape as above -- these are
  # specific enough as PHRASES that none of them match "data engineer" (e.g.
  # "software engineer" doesn't appear as a substring of "data engineer"),
  # so they're safe in a way bare "engineer" isn't. Found via the real
  # 50-posting digest: "Backend Engineer, Payments and Risk" matched "risk",
  # "Software Engineer, Reconciliation & Reporting" matched "reporting".
  # Verified explicitly: "Data Engineer" still matches with these added.
  - software engineer
  - backend engineer
  - frontend
  - full stack
  - android
  - ios
  - security engineer
  - sre # e.g. "... Site Reliability Engineer (SRE)"
  - site reliability
  - software test

  # seniority-tier suffixes. "ii" is deliberately NOT here -- "Analyst II" is
  # entry-level-adjacent at the employers this is targeting. iii/iv read as
  # senior tracks and should still be excluded.
  - iii
  - iv

  # roles that are structurally different from data/analyst work even when
  # they share vocabulary with the includes above (e.g. "quality" overlapping
  # "data quality"). NOT "marketing" -- marketing analytics is a legitimate
  # target, unlike these.
  - qa
  - quality assurance
  - help desk
  - helpdesk
  - service desk
  - desktop
  - technical support
  - it support
  - system support # "System Support Analyst I" slipped past "it support"
  # PLURAL on purpose, and it is the plural that makes this precise. FIS uses
  # "<Role> Specialists" as a grade marker ("Service Delivery Analyst
  # Specialists", "Software Test Analyst Specialists"), while legitimate bank
  # compliance titles use the SINGULAR ("AML Analyst Specialist - Regulatory
  # Compliance&MLRO" at Global Payments). Because the matcher appends an
  # optional "s" rather than stripping one, a plural keyword matches only
  # plural text -- so this hits all three FIS titles and none of the singular
  # ones. Verified against all 372 stored specialist rows. A singular
  # "analyst specialist" entry was rejected: it also killed the Global
  # Payments AML title. Standalone "AML Specialist"/"Sanctions Specialist"
  # are untouched either way.
  - analyst specialists
  - architect # e.g. "AI GRC Architect"
  - investment banking

  # bank seniority prefixes. AVP (Assistant Vice President) is a real
  # mid-level rank, not entry-level, and SVP/EVP are well above it.
  # Deliberately NOT "officer": that would kill "Quantitative Model
  # Development Officer II - Anti-Money Laundering" (Truist), which is
  # squarely a target role -- "Officer" is a rank marker at banks, not a
  # seniority signal on its own.
  - svp
  - evp
  - avp
  - chief

  # client-facing wealth roles. A different job family that happens to wear
  # the word "Analyst" -- mostly Morgan Stanley private-wealth client service.
  - private wealth
  - wealth management
  - client relationship

  # Morgan Stanley uses "Associate" as a post-MBA rank (3-5 years), not an
  # entry-level title, and spells it out in the title itself.
  - job level - associate

# Location must contain at least one of location_include_keywords OR
# location_include_state_codes (below). ATS location fields are messy
# multi-value strings (e.g. "Remote, Canada; Remote, United States", or plain
# "Romeoville, IL" with no country at all). Matched permissively on purpose —
# every posting that passes the title filter but fails this one gets printed
# by the digest step (grouped by its raw location string) specifically so
# these lists can be tuned against what's actually being missed.
#
# Deliberately does NOT include a bare "remote" with no country/state — that's
# genuinely ambiguous (could be remote-anywhere) and should default to
# excluded-and-reviewed, not silently included.
location_include_keywords:
  - united states
  - usa
  # bare "US" (case-insensitive, whole word, period-stripped -- see
  # job_ingest/filters.py) covers "U.S." and every other format where the
  # country marker isn't part of one of the fixed phrases below, e.g. real
  # data: "US IL - Remote", "US WA Seattle - Remote", "Remote (US)". State
  # codes get their own stricter matching (location_include_state_codes)
  # precisely because a bare 2-letter code has collision risk that bare "us"
  # doesn't in practice. (Used to also carry explicit "u.s." and "remote (us)"
  # entries here -- both now redundant once period-stripping and this bare
  # "us" entry exist, so removed rather than left as unreachable duplicates.)
  - us
  - remote, us
  - remote - us
  - north america # broad: also covers Canada/Mexico, permissive by design

  # Spelled-out state names, added specifically to offset the recall lost by
  # requiring state codes below to be comma-anchored + uppercase (a location
  # written as "Austin, Texas" instead of "Austin, TX" would otherwise miss).
  # Matched the same permissive, case-insensitive way as the phrases above.
  - alabama
  - alaska
  - arizona
  - arkansas
  - california
  - colorado
  - connecticut
  - delaware
  - florida
  - georgia # ambiguous with the country Georgia -- permissive by design, same tradeoff as "north america" above
  - hawaii
  - idaho
  - illinois
  - indiana
  - iowa
  - kansas
  - kentucky
  - louisiana
  - maine
  - maryland
  - massachusetts
  - michigan
  - minnesota
  - mississippi
  - missouri
  - montana
  - nebraska
  - nevada
  - new hampshire
  - new jersey
  - new mexico
  - new york
  - north carolina
  - north dakota
  - ohio
  - oklahoma
  - oregon
  - pennsylvania
  - rhode island
  - south carolina
  - south dakota
  - tennessee
  - texas
  - utah
  - vermont
  - virginia
  - washington # ambiguous with Washington, DC -- harmless, DC is also US
  - west virginia
  - wisconsin
  - wyoming
  - district of columbia

# US state 2-letter codes. Matched ONLY as ", XX" -- a comma, optional
# whitespace, then the code exactly as written here (case-SENSITIVE) -- e.g.
# "Romeoville, IL" matches, but neither a lowercase "il" nor a bare standalone
# "IL"/"in"/"or" elsewhere in a string does. This is deliberately stricter
# than location_include_keywords above: a case-insensitive bare-word match on
# a 2-letter code risks colliding with common English words a permissive
# location field could plausibly contain ("in", "or", "hi", "me", "de", ...).
# See job_ingest/filters.py:_contains_state_code.
location_include_state_codes:
  - AL
  - AK
  - AZ
  - AR
  - CA
  - CO
  - CT
  - DE
  - FL
  - GA
  - HI
  - ID
  - IL
  - IN
  - IA
  - KS
  - KY
  - LA
  - ME
  - MD
  - MA
  - MI
  - MN
  - MS
  - MO
  - MT
  - NE
  - NV
  - NH
  - NJ
  - NM
  - NY
  - NC
  - ND
  - OH
  - OK
  - OR
  - PA
  - RI
  - SC
  - SD
  - TN
  - TX
  - UT
  - VT
  - VA
  - WA
  - WV
  - WI
  - WY
  - DC

# Digest priority tiering. A matched posting whose TITLE hits any keyword here
# goes into Tier 1 and is listed first in the email; everything else is
# Tier 2. Tier 1 is never truncated by the 50-posting cap -- see
# job_ingest/digest.py -- because missing an internship deadline costs more
# than a long email.
#
# MAINTENANCE: the year entries below go stale. As written they target a
# Dec 2027 graduation (spring/summer/fall 2027 internships, May or Aug 2027
# full-time starts). Once 2027 postings stop appearing, bump these or campus
# roles quietly stop being prioritised -- the filter will not complain, they
# will just drift into Tier 2.
#
# The non-year entries ("analyst program", rotational, campus, and the
# intern/co-op spellings) exist precisely so that a posting whose title
# carries no year still reaches Tier 1 on its own merits. They are the
# durable half of this list; the years are the perishable half.
priority_keywords:
  - intern
  - internship
  - co-op
  - coop
  - campus
  - analyst program
  - rotational
  - leadership development program
  - new grad
  - university program
  - "2027"
  - "2028"
