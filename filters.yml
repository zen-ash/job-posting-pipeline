# Digest filters — deterministic keyword rules applied to postings that are
# otherwise pending notification (notified_at IS NULL AND closed_at IS NULL),
# before the round-robin + 50-cap selection. This is intentionally dumb
# (whole-word/phrase matching, no ML) — LLM-based relevance scoring is a later,
# separate step (see README "what's next"), not this.
#
# A posting must satisfy ALL of:
#   1. title contains at least one of title_include_keywords
#   2. title contains NONE of title_exclude_keywords
#   3. location contains at least one of location_include_keywords
#
# All matching is case-insensitive, period-stripped, and whole-word/phrase, so
# "sql" won't match "MySQL", "us" won't match inside "Russia", and "U.S." /
# "Sr." match exactly like "US" / "Sr" without needing separate keyword
# entries for the punctuated form — see job_ingest/filters.py. (US state codes
# below are the one exception: matched case-SENSITIVE and only immediately
# after a comma — see location_include_state_codes.)

title_include_keywords:
  # generic — 'analyst' alone catches most target titles
  - analyst
  - analytics
  - data analyst
  - business intelligence
  - data engineer
  - data scientist
  - reporting
  - insights
  - sql

  # audit & controls
  - audit
  - internal controls
  - sox
  - risk advisory

  # compliance & financial crime
  - compliance
  - aml
  - anti-money laundering
  - financial crimes
  - kyc
  - due diligence
  - transaction monitoring
  - sanctions
  - ofac
  - bsa
  - regulatory reporting

  # risk
  - risk
  - operational risk
  - vendor risk
  - third-party risk
  - enterprise risk
  - model validation

  # governance & data
  - data governance
  - grc

  # healthcare
  - claims
  - risk adjustment
  - revenue cycle
  - healthcare data

  # early-career signals
  - intern
  - internship
  # "associate" (bare) removed -- it's a generic entry-level title suffix used
  # across every department (sales, BD, private equity, collections), not a
  # domain signal. Confirmed against real data: it accounted for 70/153
  # (46%) of all matches, nearly all false positives ("Business Development
  # Associate", "Fraud Operations Associate"). A genuinely relevant title
  # like "Risk Associate" or "Compliance Associate" already matches on the
  # domain word ("risk"/"compliance") without needing "associate" at all, so
  # dropping it costs nothing on recall.
  - entry level
  - new grad
  - university

title_exclude_keywords:
  - senior
  - sr
  # "staff" alone excluded too much -- "Staff Analyst" is an ENTRY-LEVEL title
  # at universities and government agencies (both on the target list), and a
  # bare "staff" exclude was silently killing exactly those postings. Narrowed
  # to the specific senior-track phrases that were actually meant.
  - staff engineer
  - staff software
  - principal
  - lead
  - manager
  - director
  - vp
  - vice president
  - head of
  - sales associate
  - associate director
  - associate general counsel
  - associate professor

  # legal roles pulled in by the broad compliance/risk includes above
  - counsel
  - attorney
  - paralegal

  # department-name collisions: an engineer or designer who happens to sit on
  # a team literally called "Risk" (e.g. "Backend Engineer, Payments and
  # Risk") matches the "risk" include even though the role itself has nothing
  # to do with risk analysis. This generalizes better than narrowing "risk"
  # itself. Deliberately does NOT include "engineer" or "scientist" -- both
  # collide with existing include phrases ("data engineer", "data scientist")
  # and, since the exclude check runs independently of which include keyword
  # actually fired, would silently kill those two core target titles too.
  # Verified explicitly before deciding this: with "engineer"/"scientist" in
  # this list, both "Data Engineer" and "Data Scientist" test as excluded.
  - designer
  - developer

  # seniority-tier suffixes. "ii" is deliberately NOT here -- "Analyst II" is
  # entry-level-adjacent at the employers this is targeting. iii/iv read as
  # senior tracks and should still be excluded.
  - iii
  - iv

  # roles that are structurally different from data/analyst work even when
  # they share vocabulary with the includes above (e.g. "quality" overlapping
  # "data quality"). NOT "marketing" -- marketing analytics is a legitimate
  # target, unlike these.
  - qa
  - quality assurance
  - help desk
  - helpdesk
  - service desk
  - desktop
  - technical support
  - it support
  - investment banking

# Location must contain at least one of location_include_keywords OR
# location_include_state_codes (below). ATS location fields are messy
# multi-value strings (e.g. "Remote, Canada; Remote, United States", or plain
# "Romeoville, IL" with no country at all). Matched permissively on purpose —
# every posting that passes the title filter but fails this one gets printed
# by the digest step (grouped by its raw location string) specifically so
# these lists can be tuned against what's actually being missed.
#
# Deliberately does NOT include a bare "remote" with no country/state — that's
# genuinely ambiguous (could be remote-anywhere) and should default to
# excluded-and-reviewed, not silently included.
location_include_keywords:
  - united states
  - usa
  # bare "US" (case-insensitive, whole word, period-stripped -- see
  # job_ingest/filters.py) covers "U.S." and every other format where the
  # country marker isn't part of one of the fixed phrases below, e.g. real
  # data: "US IL - Remote", "US WA Seattle - Remote", "Remote (US)". State
  # codes get their own stricter matching (location_include_state_codes)
  # precisely because a bare 2-letter code has collision risk that bare "us"
  # doesn't in practice. (Used to also carry explicit "u.s." and "remote (us)"
  # entries here -- both now redundant once period-stripping and this bare
  # "us" entry exist, so removed rather than left as unreachable duplicates.)
  - us
  - remote, us
  - remote - us
  - north america # broad: also covers Canada/Mexico, permissive by design

  # Spelled-out state names, added specifically to offset the recall lost by
  # requiring state codes below to be comma-anchored + uppercase (a location
  # written as "Austin, Texas" instead of "Austin, TX" would otherwise miss).
  # Matched the same permissive, case-insensitive way as the phrases above.
  - alabama
  - alaska
  - arizona
  - arkansas
  - california
  - colorado
  - connecticut
  - delaware
  - florida
  - georgia # ambiguous with the country Georgia -- permissive by design, same tradeoff as "north america" above
  - hawaii
  - idaho
  - illinois
  - indiana
  - iowa
  - kansas
  - kentucky
  - louisiana
  - maine
  - maryland
  - massachusetts
  - michigan
  - minnesota
  - mississippi
  - missouri
  - montana
  - nebraska
  - nevada
  - new hampshire
  - new jersey
  - new mexico
  - new york
  - north carolina
  - north dakota
  - ohio
  - oklahoma
  - oregon
  - pennsylvania
  - rhode island
  - south carolina
  - south dakota
  - tennessee
  - texas
  - utah
  - vermont
  - virginia
  - washington # ambiguous with Washington, DC -- harmless, DC is also US
  - west virginia
  - wisconsin
  - wyoming
  - district of columbia

# US state 2-letter codes. Matched ONLY as ", XX" -- a comma, optional
# whitespace, then the code exactly as written here (case-SENSITIVE) -- e.g.
# "Romeoville, IL" matches, but neither a lowercase "il" nor a bare standalone
# "IL"/"in"/"or" elsewhere in a string does. This is deliberately stricter
# than location_include_keywords above: a case-insensitive bare-word match on
# a 2-letter code risks colliding with common English words a permissive
# location field could plausibly contain ("in", "or", "hi", "me", "de", ...).
# See job_ingest/filters.py:_contains_state_code.
location_include_state_codes:
  - AL
  - AK
  - AZ
  - AR
  - CA
  - CO
  - CT
  - DE
  - FL
  - GA
  - HI
  - ID
  - IL
  - IN
  - IA
  - KS
  - KY
  - LA
  - ME
  - MD
  - MA
  - MI
  - MN
  - MS
  - MO
  - MT
  - NE
  - NV
  - NH
  - NJ
  - NM
  - NY
  - NC
  - ND
  - OH
  - OK
  - OR
  - PA
  - RI
  - SC
  - SD
  - TN
  - TX
  - UT
  - VT
  - VA
  - WA
  - WV
  - WI
